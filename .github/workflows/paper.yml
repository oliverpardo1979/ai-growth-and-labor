name: Publish the PDF; preserve the approved digital edition

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test PDF-only publication safeguards
        run: python -m unittest discover -s tests -p 'test_pdf_only_publication.py'
      - name: Read the approved digital-edition snapshot
        id: digital
        run: echo "ref=$(python scripts/prepare_pdf_publication.py ref)" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned digital edition
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.digital.outputs.ref }}
          path: _digital_snapshot
          persist-credentials: false
      - name: Compile the current manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main_rewrite.tex
      - name: Replace only the stable PDF in the approved site
        run: |
          python scripts/prepare_pdf_publication.py stage \
            --snapshot _digital_snapshot --pdf main_rewrite.pdf --output _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the current PDF without changing the digital edition
        id: deployment
        uses: actions/deploy-pages@v4
